name: Cloudflare Deploy

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

concurrency:
  group: cloudflare-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      # ジョブレベルの if では secrets を参照できないため、ステップで設定有無を判定する
      - name: Check Cloudflare configuration
        id: cf-config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          HYPERDRIVE_ID_PRODUCTION: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID_PRODUCTION }}
          HYPERDRIVE_ID_PREVIEW: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID_PREVIEW }}
        run: |
          # 式の `a && b || c` は b が空だと c に倒れるため、対象環境の ID はシェルで厳密に選ぶ
          case "${GITHUB_REF_NAME}" in
            main) HYPERDRIVE_ID="${HYPERDRIVE_ID_PRODUCTION:-}" ;;
            preview) HYPERDRIVE_ID="${HYPERDRIVE_ID_PREVIEW:-}" ;;
            *)
              echo "configured=false" >> "$GITHUB_OUTPUT"
              echo "Deploys run only from main (production) or preview (staging)."
              exit 0
              ;;
          esac
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$HYPERDRIVE_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Cloudflare deploy."
            echo "Set repository secret: CLOUDFLARE_API_TOKEN"
            echo "Set repository variables: CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_HYPERDRIVE_ID_PRODUCTION, CLOUDFLARE_HYPERDRIVE_ID_PREVIEW"
          fi

      - name: Checkout
        if: steps.cf-config.outputs.configured == 'true'
        uses: actions/checkout@v6

      - name: Setup Node.js
        if: steps.cf-config.outputs.configured == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        if: steps.cf-config.outputs.configured == 'true'
        run: npm ci

      - name: Ensure rollup platform binary
        if: steps.cf-config.outputs.configured == 'true'
        run: npm rebuild rollup || true

      - name: Build client
        if: steps.cf-config.outputs.configured == 'true'
        run: |
          node scripts/sync-version.mjs
          npm run build:client

      - name: Render wrangler config
        if: steps.cf-config.outputs.configured == 'true'
        env:
          HYPERDRIVE_ID_PRODUCTION: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID_PRODUCTION }}
          HYPERDRIVE_ID_PREVIEW: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID_PREVIEW }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            HYPERDRIVE_ID="$HYPERDRIVE_ID_PRODUCTION" sh scripts/cloudflare-render-config.sh production
          else
            HYPERDRIVE_ID="$HYPERDRIVE_ID_PREVIEW" sh scripts/cloudflare-render-config.sh preview
          fi

      # 旧 vercel-build.sh のシード処理（冪等）。DB の直接接続 URL がある場合のみ実行する
      - name: Seed accounts
        if: steps.cf-config.outputs.configured == 'true'
        env:
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          PREVIEW_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL }}
          TEST_PHARMACY_SEED_JSON: ${{ secrets.TEST_PHARMACY_SEED_JSON }}
        run: |
          # 式の `a && b || c` は b が空だと c に倒れるため、ブランチごとの URL はシェルで厳密に選ぶ
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            POSTGRES_URL="${PRODUCTION_DATABASE_URL:-}"
          else
            POSTGRES_URL="${PREVIEW_DATABASE_URL:-}"
          fi
          export POSTGRES_URL POSTGRES_URL_NON_POOLING="$POSTGRES_URL"
          if [ -z "$POSTGRES_URL" ]; then
            echo "PRODUCTION_DATABASE_URL / PREVIEW_DATABASE_URL is not set; skipping seeds."
            exit 0
          fi
          if [ -n "${TEST_PHARMACY_SEED_JSON:-}" ]; then
            npx tsx server/src/db/seed-test-pharmacy-accounts.ts || echo "::warning::test pharmacy seeding failed (non-fatal)"
          fi
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            npx tsx server/src/db/seed-playwright-accounts.ts || echo "::warning::Playwright account seeding failed (non-fatal)"
          fi

      - name: Deploy Worker
        id: deploy
        if: steps.cf-config.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            npx wrangler deploy -c wrangler.deploy.jsonc --env ""
          else
            npx wrangler deploy -c wrangler.deploy.jsonc --env preview
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"

  # preview に実際にデプロイしたときだけ、デプロイ済み URL へスモークを実行する
  preview-smoke:
    needs: deploy
    if: github.ref_name == 'preview' && needs.deploy.outputs.deployed == 'true'
    uses: ./.github/workflows/preview-smoke.yml
