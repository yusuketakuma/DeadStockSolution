name: Preview Smoke

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preview smoke checks
        if: ${{ vars.PREVIEW_SMOKE_BASE_URL != '' }}
        env:
          PREVIEW_SMOKE_BASE_URL: ${{ vars.PREVIEW_SMOKE_BASE_URL }}
        run: npm run smoke:preview

      - name: Skip with guide
        if: ${{ vars.PREVIEW_SMOKE_BASE_URL == '' }}
        run: |
          echo "Skipping preview smoke checks."
          echo "Set repository variable PREVIEW_SMOKE_BASE_URL to enable."
