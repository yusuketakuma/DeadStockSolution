name: Preview Smoke

on:
  push:
    branches:
      - preview
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run preview release-equivalent gate
        env:
          RELEASE_SMOKE_BASE_URL: ${{ vars.PREVIEW_BRANCH_SMOKE_BASE_URL || vars.PREVIEW_SMOKE_BASE_URL }}
          PREVIEW_PROTECTION_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          SMOKE_VERCEL_GITHUB_SHA: ${{ github.sha }}
          SMOKE_VERCEL_GITHUB_REF: ${{ github.ref_name }}
          SMOKE_RESOLVE_TIMEOUT_MS: "600000"
        run: npm run verify:release
