name: Preview Smoke

on:
  # Cloudflare への preview デプロイ完了後に、デプロイ済み URL へスモークを実行する
  workflow_run:
    workflows: [Cloudflare Deploy]
    types: [completed]
    branches: [preview]
  workflow_dispatch:

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preview release-equivalent gate
        env:
          # 例: https://deadstocksolution-preview.<account>.workers.dev
          RELEASE_SMOKE_BASE_URL: ${{ vars.PREVIEW_BRANCH_SMOKE_BASE_URL || vars.PREVIEW_SMOKE_BASE_URL }}
        run: npm run verify:release
