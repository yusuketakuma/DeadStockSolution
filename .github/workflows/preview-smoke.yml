name: Preview Smoke

on:
  # Cloudflare Deploy が preview へ実際にデプロイしたときに呼び出される（手動実行も可）
  workflow_call:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run preview release-equivalent gate
        env:
          # 例: https://deadstocksolution-preview.<account>.workers.dev
          # 旧 Vercel の PREVIEW_BRANCH_SMOKE_BASE_URL には戻らない（旧環境を検証してしまうため）
          RELEASE_SMOKE_BASE_URL: ${{ vars.PREVIEW_SMOKE_BASE_URL }}
        run: |
          if [ -z "$RELEASE_SMOKE_BASE_URL" ]; then
            echo "::error::PREVIEW_SMOKE_BASE_URL（Cloudflare のプレビュー URL）を GitHub 変数に設定してください"
            exit 1
          fi
          npm run verify:release
