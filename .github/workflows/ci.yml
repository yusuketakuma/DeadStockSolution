name: CI

on:
  push:
    branches:
      - main
      - dev
      - preview
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-upload-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test upload/drug-master integration flows
        run: npm run test:integration:server

  verify:
    needs: integration-upload-flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run quality gate
        env:
          QUALITY_GATE_READ_ONLY: '1'
          QUALITY_GATE_SKIP_SYNC: '1'
          QUALITY_GATE_SKIP_INSTALL: '1'
          QUALITY_GATE_ALLOW_DIRTY: '1'
        run: npm run quality:gate

      - name: Check OpenAPI contract
        run: npm run openapi:check

      - name: Run OpenAPI contract test
        run: npm run test:openapi-contract --workspace=server

      - name: Audit production dependencies (moderate+)
        run: npm run audit:prod

      - name: Performance regression guard (server)
        run: npm run test:perf:server

      - name: Build server
        run: npm run build:server

      - name: Build client
        run: npm run build:client

      - name: Test coverage server
        run: npm run test:coverage:server

      - name: Test coverage client
        run: npm run test:coverage:client
