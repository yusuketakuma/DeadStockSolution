name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Ensure rollup platform binary
        run: npm rebuild rollup || true

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

  lint-typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test-server:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Server full test suite
        run: npm run test:server

      - name: Performance regression guard
        run: npm run test:perf:server

  test-client:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Client full test suite
        run: npm run test:client

  integration:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Test upload/drug-master integration flows
        run: npm run test:integration:server

  verify:
    needs: [lint-typecheck, test-server, test-client, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Check OpenAPI contract
        run: npm run openapi:check

      - name: Run OpenAPI contract test
        run: npm run test:openapi-contract --workspace=server

      - name: Audit production dependencies (moderate+)
        run: npm run audit:prod

      - name: Build server
        run: npm run build:server

      - name: Build client
        run: npm run build:client
