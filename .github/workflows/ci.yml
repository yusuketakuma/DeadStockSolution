name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-upload-flows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test upload/drug-master integration flows
        run: npm run test:integration:server

  verify:
    needs: integration-upload-flows
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Performance regression guard (server)
        run: npm run test:perf:server

      - name: Typecheck client
        run: npm run typecheck:client

      - name: Build server
        run: npm run build:server

      - name: Build client
        run: npm run build:client

      - name: Test server
        run: npm run test:server

      - name: Test client
        run: npm run test:client

      - name: Test coverage server
        run: npm run test:coverage:server

      - name: Test coverage client
        run: npm run test:coverage:client
