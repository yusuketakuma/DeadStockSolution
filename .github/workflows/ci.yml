name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup platform binary
        run: npm rebuild rollup || true

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

  lint-typecheck:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test-server:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Server full test suite
        run: npm run test:server

      - name: Performance regression guard
        run: npm run test:perf:server

  test-client:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Client full test suite
        run: npm run test:client

  integration:
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Test upload/drug-master integration flows
        run: npm run test:integration:server

  proposal-flow-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: development
      VERCEL_ENV: ""
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_URL_NON_POOLING: postgres://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: deadstock-proposal-flow-e2e-jwt-secret-2026
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      E2E_HELPER_SECRET: ci-proposal-flow-secret
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup platform binary
        run: npm rebuild rollup || true

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Proposal flow E2E smoke
        run: npm run test:e2e:proposal-flow

  login-dashboard-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      NODE_ENV: development
      VERCEL_ENV: ""
      POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      POSTGRES_URL_NON_POOLING: postgres://postgres:postgres@127.0.0.1:5432/postgres
      JWT_SECRET: deadstock-login-dashboard-e2e-jwt-secret-2026
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      E2E_HELPER_SECRET: ci-login-dashboard-secret
      E2E_BASE_URL: http://127.0.0.1:5173
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure rollup platform binary
        run: npm rebuild rollup || true

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: DB push and seed
        run: |
          npm run db:push --workspace=server
          npm run db:seed-playwright-accounts --workspace=server

      - name: Start server
        run: |
          PORT=3101 npm run dev --workspace=server &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"

      - name: Start client
        run: |
          npm run dev --workspace=client -- --host 127.0.0.1 --port 5173 &
          echo "CLIENT_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for servers
        run: |
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3101/api/health && break; sleep 1; done
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:5173 && break; sleep 1; done

      - name: Login and dashboard E2E
        run: npx playwright test dev/e2e/tests/login-smoke.spec.ts dev/e2e/tests/dashboard-runtime-audit.spec.ts

      - name: Stop servers
        if: always()
        run: |
          kill $SERVER_PID 2>/dev/null || true
          kill $CLIENT_PID 2>/dev/null || true

  verify:
    needs: [lint-typecheck, test-server, test-client, integration, proposal-flow-e2e, login-dashboard-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            client/node_modules
            server/node_modules
          key: nm-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }}

      - name: Check OpenAPI contract
        run: npm run openapi:check

      - name: Run OpenAPI contract test
        run: npm run test:openapi-contract --workspace=server

      - name: Audit production dependencies (moderate+)
        run: npm run audit:prod

      - name: Build server
        run: npm run build:server

      - name: Build client
        run: npm run build:client
