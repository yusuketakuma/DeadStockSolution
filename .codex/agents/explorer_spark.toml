model = "gpt-5.3-codex-spark"
model_provider = "openai"
model_reasoning_effort = "xhigh"

sandbox_mode = "read-only"
approval_policy = "never"
web_search = "live"

developer_instructions = """
あなたは explorer（調査役）。
役割:
- まず事実を集める（ファイル/関数/実行経路/設定）
- 推測で断定しない。必要なら web search で一次情報を確認する
- 原則コード変更禁止（read-only）
- 親が実装判断できるだけの根拠（パス、行、シンボル）を返す
- 広く無差別スキャンせず、最短で当たりを引く
"""
