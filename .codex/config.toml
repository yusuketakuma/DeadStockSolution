# =========================================
# Root keys（必ず先頭）
# =========================================
model = "gpt-5.3-codex"
review_model = "gpt-5.3-codex"
model_provider = "openai"

model_reasoning_effort = "medium"
# model_reasoning_summary = "auto"

approval_policy = "never"
sandbox_mode = "workspace-write"

web_search = "live"
personality = "pragmatic"

suppress_unstable_features_warning = true

# AGENTS.md 読み込み上限（既定 32KiB）
project_doc_max_bytes = 65536

cli_auth_credentials_store = "auto"
mcp_oauth_credentials_store = "auto"

agents.max_threads = 8


# =========================================
# Features（公式キーのみ）
# =========================================
[features]
collaboration_modes = true       # /plan 等（既定ONだが明示）
multi_agent = true               # spawn_agent 等（既定OFF）
request_rule = false             # removed flag: keep disabled for compatibility
runtime_metrics = true

shell_tool = true
unified_exec = true
shell_snapshot = true

apps = false                     # temporary mitigation for codex_apps handshake failure
apps_mcp_gateway = true
search_tool = false              # removed flag: keep disabled for compatibility

apply_patch_freeform = false
personality = true
powershell_utf8 = true           # macでも害なし（Windows配慮）


# =========================================
# Workspace-write sandbox options
# =========================================
[sandbox_workspace_write]
network_access = true


# =========================================
# Skills（各スキルフォルダを明示）
# =========================================
[[skills.config]]
path = ".agents/skills/repo-hygiene"
enabled = true


# =========================================
# Notice
# =========================================
[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

[notice.model_migrations]
"gpt-5.2" = "gpt-5.2-codex"


# =========================================
# Agents（役割→個別レイヤ）
# =========================================
[agents.default]
description = "Orchestrator. Plan-first, implement-all-first, then verify, then review+fix until P1=0. Never exit unfinished."
config_file = "agents/default.toml"

[agents.goal_setter]
description = "Writes detailed spec + checklist plan into tasks/todo.md."
config_file = "agents/goal_setter.toml"

[agents.explorer]
description = "Parallel exploration, impact map, web research. One task per run."
config_file = "agents/explorer.toml"

[agents.worker]
description = "Heavy implementation (tests, risky areas)."
config_file = "agents/worker.toml"

[agents.spark_worker]
description = "Light implementation for small diffs; speed-first; no cross-cutting refactors."
config_file = "agents/spark_worker.toml"

[agents.verifier]
description = "Runs typecheck -> lint -> tests; fixes failures; NO review."
config_file = "agents/verifier.toml"

[agents.review_lens]
description = "Multi-lens review across implemented and related areas; outputs prioritized findings."
config_file = "agents/review_lens.toml"

[agents.reviewer]
description = "Fix findings by severity; re-verify; re-review until P1=0 (or BLOCKED)."
config_file = "agents/reviewer.toml"


# =========================================
# MCP servers
# =========================================
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 60
tool_timeout_sec = 60

[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex"]
startup_timeout_sec = 120
tool_timeout_sec = 120

[mcp_servers.ultracite]
url = "https://docs.ultracite.ai/mcp"
startup_timeout_sec = 60
tool_timeout_sec = 60

[projects.'/Users/yusuke/DeadStockSolution']
trust_level = "trusted"
