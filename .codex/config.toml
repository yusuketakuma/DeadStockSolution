# .codex/config.toml (project-scoped)
# 読み込みには「プロジェクトを trusted」にする必要があります。

# =========================
# Root keys
# =========================
model = "gpt-5.3-codex"
review_model = "gpt-5.3-codex"
model_provider = "openai"

# 司令塔（ルートセッション）
model_reasoning_effort = "medium"
# model_reasoning_summary = "auto"

# 途中停止要因（承認待ち）を排除
approval_policy = "never"

# デフォルトはフルアクセス（危険）
sandbox_mode = "danger-full-access"

# Web search: disabled | cached | live
web_search = "live"

# 任意: pragmatic / etc
personality = "pragmatic"

# 不安定機能の警告を抑制
suppress_unstable_features_warning = true

# AGENTS.md 等のプロジェクトドキュメントを切り詰めない
project_doc_max_bytes = 131072

# 長時間コマンドを途中で殺さない（ms）
background_terminal_max_timeout = 3600000

# コンテキスト圧縮時に “未完了で終了しない規約” を保持する
experimental_compact_prompt_file = "compact_prompt.txt"

# =========================
# Features (0.107.0)
# =========================
[features]
# Multi-agent を積極利用
multi_agent = true

# /plan などのモード（必要なら）
collaboration_modes = true

# ルール/実行周り（運用で便利）
request_rule = true
runtime_metrics = true

# 実行ツール
shell_tool = true

# 既定で apps は無効（過去のエラー回避）
apps = false
apps_mcp_gateway = false
search_tool = false

# 使うなら true（ただし環境によっては不要）
remote_models = false

# パッチ自由形式は現状オフ（必要なら true）
apply_patch_freeform = false

# =========================
# TUI notifications (optional)
# =========================
[tui]
# 公式例に沿って event type を指定
notifications = ["agent-turn-complete", "approval-requested"]

# notify フックは “turnごと” に走るのでデフォルトはオフ推奨。
# 必要なら有効化して .codex/tools/notify-moshi.sh を使う。
# notify = ["bash", ".codex/tools/notify-moshi.sh"]

# =========================
# Agents
# =========================
[agents]
max_threads = 32
max_depth = 2
job_max_runtime_seconds = 21600

# --- Planner / Goal-setter ---
[agents.planner]
description = "コードベース理解→目標自動設定→作業分解→委譲設計（確認待ち禁止）"
config_file = "agents/planner.toml"

# --- Explorer (default: spark) ---
[agents.explorer]
description = "高速調査・根拠集め（read-only）。詰まったら web search / 参照を集める。"
config_file = "agents/explorer_spark.toml"

[agents.explorer_fallback]
description = "spark が使えない/失敗する場合の代替 explorer（codex medium）"
config_file = "agents/explorer_fallback.toml"

# --- Worker (default: spark) ---
[agents.worker]
description = "軽め/中規模の実装（spark xhigh）。/simplify 標準化。"
config_file = "agents/worker_spark.toml"

[agents.worker_fallback]
description = "spark が使えない/失敗する場合の代替 worker（codex medium）"
config_file = "agents/worker_fallback.toml"

[agents.worker_heavy]
description = "重い実装・設計判断・セキュリティ絡み（codex xhigh）"
config_file = "agents/worker_heavy.toml"

# --- Reviewers (read-only) ---
[agents.review_security]
description = "Security 観点レビュー（read-only）"
config_file = "agents/review_security.toml"

[agents.review_correctness]
description = "Correctness/境界ケース観点レビュー（read-only）"
config_file = "agents/review_correctness.toml"

[agents.review_quality]
description = "品質/保守性/設計観点レビュー（read-only）"
config_file = "agents/review_quality.toml"

[agents.review_performance]
description = "Performance/スケール観点レビュー（read-only）"
config_file = "agents/review_performance.toml"

[agents.review_ux]
description = "UX/アクセシビリティ/運用観点レビュー（read-only）"
config_file = "agents/review_ux.toml"

# --- Monitor ---
[agents.monitor]
description = "長時間コマンド監視・待機・ポーリング（monitor）"
config_file = "agents/monitor.toml"

# =========================
# MCP servers
# =========================

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 60

[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex"]
startup_timeout_sec = 120

[mcp_servers.ultracite]
url = "https://docs.ultracite.ai/mcp"
startup_timeout_sec = 60
