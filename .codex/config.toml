# =========================
# Root keys（必ず先頭）
# =========================
model = "gpt-5.3-codex"
review_model = "gpt-5.3-codex"
model_provider = "openai"

# 司令塔（デフォルト/Orchestrator）を最強に
model_reasoning_effort = "xhigh"

# 非対話で止めない
approval_policy = "never"

# デフォルトをフルアクセス（正式名：danger-full-access）
# ※サンドボックス無効化。隔離環境前提で運用推奨。
sandbox_mode = "danger-full-access"

# Web検索は積極利用（full access 系では live が基本になる）
web_search = "live"
personality = "pragmatic"

suppress_unstable_features_warning = true
project_doc_max_bytes = 65536

# =========================
# Multi-agents（常時32）
# =========================
[agents]
max_threads = 32
max_depth = 1

# =========================
# Agent roles（細分化）
# =========================
[agents.default]
description = """
Orchestrator（指示役）。
- triage/scope/doc を並列で走らせて計画確定
- 実装はまとめて（途中レビュー禁止）
- 最後に verifier → review_*（多観点並列）→ fixer → verifier の順でゲート
- 未完成で終了禁止（DONE/BLOCKEDのみ）
"""

[agents.goal_setter]
description = "Goal setter（deep）: repo理解→目標/実装計画/検証計画（read-only）"
config_file = "agents/goal_setter.toml"

[agents.triage]
description = "Triage（spark）: 見積/分割/委譲を厳密化（read-only）"
config_file = "agents/triage.toml"

[agents.scope_mapper]
description = "Scope mapper（spark）: 影響範囲を抽出（read-only）"
config_file = "agents/scope_mapper.toml"

[agents.doc_researcher]
description = "Doc/Web researcher（spark）: 公式一次情報→設定キー化（read-only）"
config_file = "agents/doc_researcher.toml"

[agents.worker_light]
description = "Worker light（spark）: 小改修専任（<=250LOC & <=4 files）"
config_file = "agents/worker_light.toml"

[agents.worker_heavy]
description = "Worker heavy（codex）: 横断変更/高リスク領域/難所"
config_file = "agents/worker_heavy.toml"

[agents.test_writer]
description = "Test writer（spark）: 追加/更新テスト"
config_file = "agents/test_writer.toml"

[agents.verifier]
description = "Verifier（spark）: typecheck→lint→tests の一括検証"
config_file = "agents/verifier.toml"

[agents.review_correctness]
description = "Review lens（spark）: correctness/edge cases"
config_file = "agents/review_correctness.toml"

[agents.review_frontend_flow]
description = "Review lens（spark）: UIイベント/副作用/遷移/401競合"
config_file = "agents/review_frontend_flow.toml"

[agents.review_authz]
description = "Review lens（spark）: AuthZ/ownership fail-open"
config_file = "agents/review_authz.toml"

[agents.review_injection]
description = "Review lens（spark）: SQL/CSV/HTML 注入面"
config_file = "agents/review_injection.toml"

[agents.review_secrets]
description = "Review lens（spark）: secrets露出"
config_file = "agents/review_secrets.toml"

[agents.review_perf]
description = "Review lens（spark）: perf/query/render/IO"
config_file = "agents/review_perf.toml"

[agents.review_dx]
description = "Review lens（spark）: maintainability/DX"
config_file = "agents/review_dx.toml"

[agents.review_ci]
description = "Review lens（spark）: CI/CD/workflows"
config_file = "agents/review_ci.toml"

[agents.review_security]
description = "Security deep（codex）: 重大な攻撃面の最終監査（read-only）"
config_file = "agents/review_security.toml"

[agents.fixer]
description = "Fixer（spark）: 指摘を実装修正→再検証"
config_file = "agents/fixer.toml"

[agents.monitor]
description = "Monitor（spark）: wait/poll/進捗要約のみ"
config_file = "agents/monitor.toml"

# =========================
# Features（Appsは無効）
# =========================
[features]
collaboration_modes = true
multi_agent = true
child_agents_md = true

shell_tool = true
unified_exec = true
shell_snapshot = true
apply_patch_freeform = false

# Appsは完全OFF（app系トラブルを根絶）
apps = false
apps_mcp_gateway = false
search_tool = false

request_rule = true
personality = true
remote_models = false
runtime_metrics = true
powershell_utf8 = true
use_linux_sandbox_bwrap = false

# =========================
# Sandbox（workspace-write の残骸：将来 profile で戻す用に残してOK）
# =========================
[sandbox_workspace_write]
network_access = true

# =========================
# Notice（フルアクセス警告を一度認知した扱い）
# =========================
[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true

# =========================
# MCP servers（必要なら維持）
# =========================
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 60

[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex"]
startup_timeout_sec = 120

[mcp_servers.ultracite]
url = "https://docs.ultracite.ai/mcp"
startup_timeout_sec = 60
