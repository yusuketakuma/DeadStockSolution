# .codex/config.toml
# Codex CLI 0.106.0 tuned: multi-agent heavy, web live, apps off, 32 threads.

# =========================
# Root keys（必ず先頭）
# =========================
model = "gpt-5.3-codex"
review_model = "gpt-5.3-codex"
model_provider = "openai"

# 司令塔（このセッション）の推論強度
model_reasoning_effort = "xhigh"

# 非対話運用（承認で止めない）
approval_policy = "never"

# デフォルトはフルアクセス（要リスク理解）
sandbox_mode = "danger-full-access"

# Web search: full access時はliveがデフォルトだが明示してブレを潰す
web_search = "live"

# 出力トーン（短く実務寄り）
personality = "pragmatic"

# AGENTS.md の読み込み上限（デフォルト32KiBを維持＝遅延/肥大化回避）
project_doc_max_bytes = 32768

# =========================
# Notice
# =========================
[notice]
hide_full_access_warning = true
hide_rate_limit_model_nudge = true
# under-development featureの警告を抑制
suppress_unstable_features_warning = true

# =========================
# Features（0.106.0時点の主要フラグ）
# =========================
[features]
# 重要：collab は deprecated → multi_agent を使う
multi_agent = true

# collaboration modes（Plan/Default等）を維持
collaboration_modes = true

# Smart approvals / rule提案（prompt自体はneverでも、rules運用の補助に使う）
request_rule = true

# 実行系（速度寄り）
shell_tool = true
unified_exec = true
shell_snapshot = true

# 使わない（必要時だけオンに）
apply_patch_freeform = false

# apps/connectors 系は無効（過去のcodex_apps事故面の回避）
apps = false
apps_mcp_gateway = false
search_tool = false

# 任意：観測（速度/コスト調整に使う）
runtime_metrics = true

# =========================
# Multi-agents
# =========================
[agents]
# ユーザー要件：常に32
max_threads = 32
# ネストは浅く（暴走/複雑化を防ぐ）
max_depth = 1

# ---- Agent roster（役割細分化）----
[agents.goal_setter]
description = "Goal setter. Quickly understand codebase + prompt, derive goals/acceptance criteria. No implementation."
config_file = "agents/goal_setter.toml"

[agents.triage]
description = "Triage + delegation. Convert goals into work packets, choose worker types with numeric thresholds, run parallel spawn orchestration plan."
config_file = "agents/triage.toml"

[agents.explorer]
description = "Codebase explorer. Fast repo mapping (entrypoints, deps, ownership), read-only mindset."
config_file = "agents/explorer.toml"

[agents.doc_researcher]
description = "Web researcher. Aggressively uses web_search for external docs/security notes; returns actionable citations."
config_file = "agents/doc_researcher.toml"

[agents.worker_light]
description = "Light implementer (codex-spark). Scope: <=250 LOC delta AND <=4 files AND tests not required or minimal."
config_file = "agents/worker_light.toml"

[agents.worker_heavy]
description = "Heavy implementer (gpt-5.3-codex). Scope: >250 LOC delta OR >4 files OR tests required OR security-sensitive change."
config_file = "agents/worker_heavy.toml"

[agents.test_writer]
description = "Test author (codex-spark). Adds/updates tests for implemented changes; aims for fast deterministic coverage."
config_file = "agents/test_writer.toml"

[agents.verifier]
description = "Verifier (codex-spark). Runs typecheck/lint/tests/build, reports failures + exact fix targets. Minimal noise."
config_file = "agents/verifier.toml"

# ---- Multi-lens reviewers（最後にまとめて走らせる）----
[agents.review_security]
description = "Security reviewer (gpt-5.3-codex). AuthZ, injection, secrets, token exposure, unsafe defaults."
config_file = "agents/review_security.toml"

[agents.review_correctness]
description = "Correctness reviewer (gpt-5.3-codex). Edge cases, invariants, error handling, backwards compatibility."
config_file = "agents/review_correctness.toml"

[agents.review_quality]
description = "Quality reviewer (codex-spark). Types, maintainability, readability, API shape, duplication."
config_file = "agents/review_quality.toml"

[agents.review_performance]
description = "Performance reviewer (codex-spark). DB/query patterns, bundle size, caching, hot paths."
config_file = "agents/review_performance.toml"

[agents.review_ux]
description = "UX reviewer (codex-spark). UI flow, copy, a11y, empty/error states."
config_file = "agents/review_ux.toml"

[agents.review_ops]
description = "Ops reviewer (codex-spark). CI workflows, scripts, deploy configs, observability."
config_file = "agents/review_ops.toml"

# ---- Fixers（レビュー指摘の反映担当）----
[agents.fixer_light]
description = "Light fixer (codex-spark). Apply small fixes (<=250 LOC delta, <=4 files)."
config_file = "agents/fixer_light.toml"

[agents.fixer_heavy]
description = "Heavy fixer (gpt-5.3-codex). Apply cross-cutting/security fixes safely; may touch many files."
config_file = "agents/fixer_heavy.toml"

[agents.release_manager]
description = "Release manager (codex-spark). Final cleanup: docs/tasks updated, done criteria met, no unfinished work."
config_file = "agents/release_manager.toml"
