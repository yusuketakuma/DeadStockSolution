# =========================
# Root keys（必ず先頭）
# =========================
model = "gpt-5.3-codex"
review_model = "gpt-5.3-codex"
model_provider = "openai"

# 司令塔（ルートセッション）は 5.3 codex xhigh
model_reasoning_effort = "xhigh"

# 非対話（承認ダイアログで止めない）
# on-failure は deprecated。never / on-request を使う。  [oai_citation:8‡OpenAI Developers](https://developers.openai.com/codex/config-reference/)
approval_policy = "never"

# デフォルトはフルアクセス（危険なので rules で最低限ガード）
sandbox_mode = "danger-full-access"

# Web検索は積極利用
web_search = "live"

# 口調（任意）
personality = "pragmatic"

# 実験機能を意図的に使うので警告は抑止
suppress_unstable_features_warning = true


# =========================
# Multi-agent limits / roles
# =========================
[agents]
max_threads = 32
max_depth = 2

# --- Explorer ---
[agents.explorer]
description = "高速調査・影響範囲特定・委譲設計（原則実装しない）。spark優先。"
config_file = "agents/explorer.toml"

[agents.explorer_fallback]
description = "explorer のフォールバック（spark不可時）。gpt-5.3-codex + medium。"
config_file = "agents/explorer_fallback.toml"

# --- Workers ---
[agents.worker_light]
description = "軽量実装（<=250LOC目安）。spark優先。/simplify必須。"
config_file = "agents/worker_light.toml"

[agents.worker_light_fallback]
description = "worker_light のフォールバック（spark不可時）。gpt-5.3-codex + medium。"
config_file = "agents/worker_light_fallback.toml"

[agents.worker_heavy]
description = "重たい実装（>800LOCや横断改修）。gpt-5.3-codex xhigh。/simplify必須。"
config_file = "agents/worker_heavy.toml"

# --- Test engineer ---
[agents.test_engineer]
description = "テスト追加/再現/検証設計。spark優先。"
config_file = "agents/test_engineer.toml"

[agents.test_engineer_fallback]
description = "test_engineer のフォールバック（spark不可時）。gpt-5.3-codex + medium。"
config_file = "agents/test_engineer_fallback.toml"

# --- Reviewers (multi-lens) ---
[agents.reviewer_security]
description = "セキュリティ観点レビュー＋修正（必要時）"
config_file = "agents/reviewer_security.toml"

[agents.reviewer_quality]
description = "正しさ/型/保守性/設計観点レビュー＋修正（必要時）"
config_file = "agents/reviewer_quality.toml"

[agents.reviewer_release]
description = "CI/Workflow/設定/運用観点レビュー＋修正（必要時）"
config_file = "agents/reviewer_release.toml"

# --- Docs writer ---
[agents.docs_writer]
description = "ドキュメント/README/運用ノート更新。spark優先。"
config_file = "agents/docs_writer.toml"

[agents.docs_writer_fallback]
description = "docs_writer のフォールバック（spark不可時）。gpt-5.3-codex + medium。"
config_file = "agents/docs_writer_fallback.toml"


# =========================
# Features（0.107.0 の config reference に準拠）
# =========================
[features]
# 実行系
shell_tool = true
unified_exec = true
shell_snapshot = true

# multi-agent（experimental; off by default）  [oai_citation:9‡OpenAI Developers](https://developers.openai.com/codex/config-reference/)
multi_agent = true

# 便利系（必要に応じて）
collaboration_modes = true
personality = true
request_rule = true

# 実験機能（速度/体験改善）
child_agents_md = true
remote_models = true
runtime_metrics = true

# Apps/connectors は明示的に無効（過去の 403 / codex_apps MCP 失敗回避）
# apps は experimental  [oai_citation:10‡OpenAI Developers](https://developers.openai.com/codex/config-reference/)
apps = false
apps_mcp_gateway = false
search_tool = false

# 使わない（必要になったら true に）
apply_patch_freeform = false

# Windows 向け（害はない）
powershell_utf8 = true


# =========================
# MCP servers（任意: 既存のものを踏襲）
# =========================

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
startup_timeout_sec = 60
required = false
enabled = true

[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--context", "codex"]
startup_timeout_sec = 120
required = false
enabled = true

[mcp_servers.ultracite]
url = "https://docs.ultracite.ai/mcp"
startup_timeout_sec = 60
required = false
enabled = true
